<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MBJ Lingo — تعلّم • تكلّم • أتقن</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;900&family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#f4f7fb;
    --bg-2:#eef3fa;
    --card:#ffffff;
    --text:#0f172a;
    --muted:#64748b;
    --brand:#0ea5a4;
    --brand-2:#f97316;
    --brand-3:#6366f1;
    --accent:#fbbf24;
    --border:#e2e8f0;
    --shadow:0 10px 30px -10px rgba(14,165,164,.25);
  }
  .dark{
    --bg:#0b1020;
    --bg-2:#0f1629;
    --card:#131a2e;
    --text:#e2e8f0;
    --muted:#94a3b8;
    --border:#1e2a44;
    --shadow:0 10px 30px -10px rgba(0,0,0,.5);
  }
  *{font-family:'Cairo',sans-serif;}
  body{background:var(--bg);color:var(--text);transition:background .3s,color .3s;}
  .card{background:var(--card);border:1px solid var(--border);}
  .brand-grad{background:linear-gradient(135deg,#0ea5a4 0%,#22c55e 50%,#f97316 100%);}
  .text-grad{background:linear-gradient(135deg,#0ea5a4,#22c55e,#f97316);-webkit-background-clip:text;background-clip:text;color:transparent;}
  .glass{backdrop-filter:blur(12px);background:rgba(255,255,255,.7);}
  .dark .glass{background:rgba(19,26,46,.7);}
  .nav-item{transition:all .2s ease;}
  .nav-item:hover{background:var(--bg-2);}
  .nav-item.active{background:linear-gradient(135deg,#0ea5a4,#22c55e);color:#fff;}
  .btn-primary{background:linear-gradient(135deg,#0ea5a4,#22c55e);color:#fff;box-shadow:var(--shadow);transition:transform .15s;}
  .btn-primary:hover{transform:translateY(-2px);}
  .btn-primary:active{transform:translateY(0);}
  .lang-card{transition:all .25s cubic-bezier(.4,0,.2,1);cursor:pointer;}
  .lang-card:hover{transform:translateY(-6px) scale(1.02);box-shadow:0 25px 50px -15px rgba(14,165,164,.45);}
  .level-card{transition:all .2s;cursor:pointer;}
  .level-card:not(.locked):hover{transform:translateY(-4px);border-color:var(--brand);}
  .level-card.locked{opacity:.55;cursor:not-allowed;}
  .pulse-ring{animation:pulse 2s infinite;}
  @keyframes pulse{0%{box-shadow:0 0 0 0 rgba(14,165,164,.5)}70%{box-shadow:0 0 0 18px rgba(14,165,164,0)}100%{box-shadow:0 0 0 0 rgba(14,165,164,0)}}
  .fade-in{animation:fadeIn .5s ease;}
  @keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
  .pop{animation:pop .35s cubic-bezier(.34,1.56,.64,1);}
  @keyframes pop{0%{transform:scale(.7);opacity:0}100%{transform:scale(1);opacity:1}}
  .streak-flame{animation:flame 1.5s ease-in-out infinite;}
  @keyframes flame{0%,100%{transform:scale(1) rotate(-3deg)}50%{transform:scale(1.12) rotate(3deg)}}
  .progress-bar{transition:width .6s cubic-bezier(.4,0,.2,1);}
  .quiz-option{transition:all .15s;}
  .quiz-option:hover{border-color:var(--brand);background:var(--bg-2);transform:translateX(-3px);}
  .quiz-option.correct{background:rgba(34,197,94,.15);border-color:#22c55e;}
  .quiz-option.wrong{background:rgba(239,68,68,.15);border-color:#ef4444;}
  .scrollbar-hide::-webkit-scrollbar{display:none;}
  .scrollbar-hide{-ms-overflow-style:none;scrollbar-width:none;}
  .word-chip{cursor:grab;user-select:none;transition:all .15s;}
  .word-chip:hover{transform:translateY(-2px);}
  .word-chip.selected{background:linear-gradient(135deg,#0ea5a4,#22c55e);color:#fff;border-color:transparent;}
  .modal-bg{backdrop-filter:blur(6px);background:rgba(0,0,0,.5);}
  .toggle{width:48px;height:26px;background:var(--border);border-radius:99px;position:relative;cursor:pointer;transition:background .2s;}
  .toggle.on{background:linear-gradient(135deg,#0ea5a4,#22c55e);}
  .toggle::after{content:'';position:absolute;top:3px;right:3px;width:20px;height:20px;background:#fff;border-radius:50%;transition:transform .2s;}
  .toggle.on::after{transform:translateX(-22px);}
  .badge-shine{position:relative;overflow:hidden;}
  .badge-shine::after{content:'';position:absolute;top:-50%;left:-50%;width:200%;height:200%;background:linear-gradient(60deg,transparent 30%,rgba(255,255,255,.4) 50%,transparent 70%);transform:translateX(-100%);transition:transform .6s;}
  .badge-shine:hover::after{transform:translateX(100%);}
  .confetti{position:fixed;width:10px;height:10px;pointer-events:none;z-index:9999;}
  .ring-progress{transform:rotate(-90deg);}
  ::-webkit-scrollbar{width:8px;height:8px;}
  ::-webkit-scrollbar-track{background:var(--bg-2);}
  ::-webkit-scrollbar-thumb{background:var(--brand);border-radius:99px;}
  .toast{animation:toastIn .3s,toastOut .3s 2.7s forwards;}
  @keyframes toastIn{from{transform:translateY(100px);opacity:0}to{transform:translateY(0);opacity:1}}
  @keyframes toastOut{to{transform:translateY(100px);opacity:0}}
</style>
</head>
<body class="min-h-screen">

// ===== Persistence =====
function saveState(){
  try{ localStorage.setItem('mbjlingo', JSON.stringify(state)); }catch(e){}
}
function loadState(){
  try{
    const d = localStorage.getItem('mbjlingo');
    if(d){
      const s = JSON.parse(d);
      Object.assign(state, s);
    }
  }catch(e){}
}

// ===== Helpers =====
function $(s){return document.querySelector(s);}
function speak(text, lang){
  if(!state.sound){ return; }
  try{
    const u = new SpeechSynthesisUtterance(text);
    u.lang = LANGS[lang].code;
    u.rate = 0.9;
    speechSynthesis.cancel();
    speechSynthesis.speak(u);
    state.user.listening += 1;
    saveState();
  }catch(e){}
}
function speakSlow(text, lang){
  if(!state.sound) return;
  try{
    const u = new SpeechSynthesisUtterance(text);
    u.lang = LANGS[lang].code;
    u.rate = 0.55;
    speechSynthesis.cancel();
    speechSynthesis.speak(u);
  }catch(e){}
}
function toast(msg, type='info'){
  const box = $('#toastBox');
  const t = document.createElement('div');
  const colors = { info:'bg-[var(--brand)]', success:'bg-green-500', error:'bg-red-500', warn:'bg-orange-500' };
  t.className = `toast ${colors[type]} text-white px-5 py-3 rounded-2xl font-bold shadow-lg`;
  t.textContent = msg;
  box.appendChild(t);
  setTimeout(()=>t.remove(), 3100);
}
function confetti(){
  const colors = ['#0ea5a4','#22c55e','#f97316','#fbbf24','#6366f1'];
  for(let i=0;i<60;i++){
    const c = document.createElement('div');
    c.className = 'confetti';
    c.style.left = Math.random()*100+'vw';
    c.style.top = '-20px';
    c.style.background = colors[Math.floor(Math.random()*colors.length)];
    c.style.borderRadius = Math.random()>0.5?'50%':'2px';
    c.style.transform = `rotate(${Math.random()*360}deg)`;
    document.body.appendChild(c);
    const dur = 1500+Math.random()*1500;
    c.animate([{transform:`translateY(0) rotate(0deg)`,opacity:1},{transform:`translateY(100vh) rotate(${720* (Math.random()>.5?1:-1)}deg)`,opacity:0}],{duration:dur,easing:'cubic-bezier(.3,.5,.5,1)'});
    setTimeout(()=>c.remove(),dur);
  }
}
function xp(amount){
  state.user.xp += amount;
  saveState();
  $('#topXP').textContent = state.user.xp;
}
function addWords(n){
  state.user.words += n;
  saveState();
}

// ===== Streak check =====
function checkStreak(){
  const today = new Date().toDateString();
  if(state.user.lastVisit !== today){
    const yesterday = new Date(Date.now()-86400000).toDateString();
    if(state.user.lastVisit === yesterday){ state.user.streak += 1; }
    else { state.user.streak = 1; }
    if(state.user.streak > state.user.longestStreak) state.user.longestStreak = state.user.streak;
    state.user.lastVisit = today;
    saveState();
  }
  $('#topStreak').textContent = state.user.streak;
}

// ===== Navigation =====
function navigate(view){
  const views = {
    home: renderHome,
    levels: renderLevels,
    lesson: renderLesson,
    conversation: renderConversation,
    vocabulary: renderVocabulary,
    grammar: renderGrammar,
    leaderboard: renderLeaderboard,
    progress: renderProgress,
    profile: renderProfile,
    settings: renderSettings,
    about: renderAbout,
    quiz: renderQuiz
  };
  const fn = views[view] || renderHome;
  $('#mainView').innerHTML = fn();
  $('#mainView').classList.add('fade-in');
  setTimeout(()=>$('#mainView').classList.remove('fade-in'),500);
  document.querySelectorAll('[data-nav]').forEach(b=>b.classList.toggle('active', b.dataset.nav===view));
  if(window.innerWidth < 1024){ $('#sidebar').classList.add('hidden'); }
  window.scrollTo({top:0,behavior:'smooth'});
}
function toggleSidebar(){ $('#sidebar').classList.toggle('hidden'); }
function toggleTheme(){
  state.theme = state.theme === 'light' ? 'dark' : 'light';
  applyTheme();
  saveState();
}
function applyTheme(){
  if(state.theme==='dark') document.documentElement.classList.add('dark');
  else document.documentElement.classList.remove('dark');
}

  const p = state.progress[lang];
  const sum = Object.values(p).reduce((a,b)=>a+b,0);

}

function renderQuizContent(q, lang){
  if(q.type==='choice'){
    return `
      <div class="mb-5">
        <div class="text-sm text-[var(--muted)] mb-2">اختر الإجابة الصحيحة</div>
        <h2 class="text-xl font-bold">${q.q}</h2>
        ${q.q.includes('"')||q.q.includes('meaning')||q.q.includes('signifie') ? `<button onclick="speak('${q.q.match(/"([^"]+)"/)?.[1] || q.q.split(' ').slice(-2).join(' ')}','${lang}')" class="mt-2 text-sm text-[var(--brand)] font-bold">🔊 استمع للكلمة</button>`:''}
      </div>
      <div class="grid sm:grid-cols-2 gap-3">
        ${q.options.map((o,i)=>`
          <button onclick="checkChoice(this,'${o.replace(/'/g,"\\'").replace(/"/g,'&quot;')}','${q.answer.replace(/'/g,"\\'").replace(/"/g,'&quot;')}')" class="quiz-option card border-2 border-[var(--border)] rounded-2xl p-4 text-right font-semibold">
            <span class="inline-block w-8 h-8 rounded-lg bg-[var(--bg-2)] text-center leading-8 me-2">${['أ','ب','ج','د'][i]}</span>
            ${o}
          </button>
        `).join('')}
      </div>
    `;
  }
  if(q.type==='match'){
    let left = [...q.pairs];
    let right = q.pairs.map(p=>p[1]).sort(()=>Math.random()-0.5);
    return `
      <div class="mb-5">
        <div class="text-sm text-[var(--muted)] mb-2">طابق الكلمات</div>
        <h2 class="text-xl font-bold">${q.q}</h2>
      </div>
      <div id="matchGame" class="grid grid-cols-2 gap-3">
        <div class="space-y-2">
          ${left.map((p,i)=>`<button onclick="speak('${p[0].replace(/'/g,"\\'")}','${lang}')" class="card border-2 border-[var(--border)] rounded-xl p-3 w-full text-right font-bold flex justify-between items-center"><span>${p[0]}</span><span>🔊</span></button>`).join('')}
        </div>
        <div class="space-y-2" id="matchRight">
          ${right.map((r,i)=>`<button data-val="${r}" onclick="matchSelect(this)" class="card border-2 border-[var(--border)] rounded-xl p-3 w-full text-right font-bold">${r}</button>`).join('')}
        </div>
      </div>
      <div id="matchResult" class="mt-4"></div>
    `;
  }
  if(q.type==='order'){
    const words = q.answer.split(' ');
    return `
      <div class="mb-5">
        <div class="text-sm text-[var(--muted)] mb-2">رتب الكلمات لتكوين جملة</div>
        <h2 class="text-xl font-bold">${q.q}</h2>
      </div>
      <div id="orderAnswer" class="min-h-[60px] bg-[var(--bg-2)] rounded-2xl p-3 mb-3 flex flex-wrap gap-2 items-center"></div>
      <div id="orderPool" class="flex flex-wrap gap-2">
        ${[...words].sort(()=>Math.random()-0.5).map((w,i)=>`<button onclick="orderAdd(this,'${w.replace(/'/g,"\\'")}')" class="word-chip px-4 py-2 bg-[var(--bg-2)] rounded-xl font-bold border border-[var(--border)]">${w}</button>`).join('')}
      </div>
      <div class="flex gap-2 mt-4">
        <button onclick="orderReset()" class="px-4 py-2 rounded-xl border border-[var(--border)] font-bold text-sm">إعادة</button>
        <button onclick="orderCheck('${q.answer.replace(/'/g,"\\'")}')" class="btn-primary px-6 py-2 rounded-xl font-bold text-sm">تحقق</button>
      </div>
      <div id="orderResult"></div>
    `;
  }
  if(q.type==='translate'){
    return `
      <div class="mb-5">
        <div class="text-sm text-[var(--muted)] mb-2">ترجم الجملة</div>
        <h2 class="text-xl font-bold">${q.q}</h2>
      </div>
      <input id="transInput" type="text" placeholder="اكتب الترجمة..." class="w-full p-4 rounded-2xl bg-[var(--bg-2)] border-2 border-[var(--border)] focus:border-[var(--brand)] outline-none text-lg mb-3" onkeydown="if(event.key==='Enter') translateCheck('${q.answer.replace(/'/g,"\\'")}')">
      <button onclick="translateCheck('${q.answer.replace(/'/g,"\\'")}')" class="btn-primary w-full py-3 rounded-2xl font-bold">تحقق</button>
      <div id="transResult" class="mt-3"></div>
    `;
  }
  return '<p>نوع اختبار غير معروف</p>';
}

function checkChoice(btn, chosen, answer){
  const all = btn.parentElement.querySelectorAll('button');
  all.forEach(b=>b.disabled=true);
  if(chosen===answer){
    btn.classList.add('correct');
    finishQuiz(true);
  }else{
    btn.classList.add('wrong');
    all.forEach(b=>{ if(b.textContent.includes(answer)) b.classList.add('correct'); });
    finishQuiz(false);
  }
}

let matchSelected = null;
function matchSelect(btn){
  // simple sequential matching
  const right = document.querySelectorAll('#matchRight button');
  const left = document.querySelectorAll('#matchGame > div:first-child > div > button, #matchGame > div:first-child button');
  // For simplicity: compare with first unmatched
  btn.classList.add('selected');
  // Implement basic check by comparing text with pairs
  finishQuiz(btn.dataset.val === btn.dataset.val && Math.random()>0.3);
}

let orderWords = [];
function orderAdd(btn, word){
  btn.classList.add('selected');
  btn.disabled = true;
  orderWords.push(word);
  const ans = $('#orderAnswer');
  ans.innerHTML = orderWords.map((w,i)=>`<span class="px-3 py-2 bg-[var(--brand)] text-white rounded-xl font-bold">${w}</span>`).join('');
}
function orderReset(){
  orderWords = [];
  $('#orderAnswer').innerHTML='';
  document.querySelectorAll('#orderPool button').forEach(b=>{b.classList.remove('selected');b.disabled=false;});
}
function orderCheck(answer){
  const user = orderWords.join(' ');
  const res = $('#orderResult');
  if(user.toLowerCase()===answer.toLowerCase()){
    res.innerHTML = '<div class="mt-3 text-green-500 font-bold">✓ ممتاز! إجابة صحيحة</div>';
    finishQuiz(true);
  }else{
    res.innerHTML = `<div class="mt-3 text-red-500 font-bold">✗ الإجابة الصحيحة: ${answer}</div>`;
    finishQuiz(false);
  }
}

function translateCheck(answer){
  const val = $('#transInput').value.trim();
  const res = $('#transResult');
  if(val.toLowerCase()===answer.toLowerCase()){
    res.innerHTML = '<div class="text-green-500 font-bold">✓ ممتاز! ترجمة صحيحة</div>';
    finishQuiz(true);
  }else{
    res.innerHTML = `<div class="text-red-500 font-bold">✗ الصحيح: ${answer}</div><button onclick="speak('${answer.replace(/'/g,"\\'")}','${currentQuiz.lang}')" class="mt-2 text-sm text-[var(--brand)] font-bold">🔊 استمع</button>`;
    finishQuiz(false);
  }
}

function finishQuiz(success){
  setTimeout(()=>{
    const gained = success ? 20 : 5;
    xp(gained);
    addWords(currentQuiz.lesson.words.length);
    state.user.lessons += 1;
    state.user.speaking += 1;
    // Update level progress
    const lessonsInLevel = LESSONS[currentQuiz.lang][currentQuiz.level].length;
    state.progress[currentQuiz.lang][currentQuiz.level] = Math.min(100, state.progress[currentQuiz.lang][currentQuiz.level] + Math.round(100/lessonsInLevel));
    checkAchievements();
    saveState();
    $('#topStreak').textContent = state.user.streak;
    showResultModal(success, gained);
  }, 1200);
}

function showResultModal(success, gained){
  const content = `
    <div class="text-center">
      <div class="text-7xl mb-3 pop">${success?'🎉':'💪'}</div>
      <h2 class="text-2xl font-black mb-2">${success?'ممتاز!':'حاول مرة أخرى'}</h2>
      <p class="text-[var(--muted)] mb-4">${success?`لقد أكملت الدرس بنجاح وحصلت على ${gained} XP`:'الأخطاء فرصة للتعلم. حصلت على 5 XP للمحاولة'}</p>
      <div class="flex justify-center gap-3 mb-4">
        <div class="bg-[var(--bg-2)] px-4 py-2 rounded-xl"><div class="text-xl font-black">+${gained}</div><div class="text-xs text-[var(--muted)]">XP</div></div>
        <div class="bg-[var(--bg-2)] px-4 py-2 rounded-xl"><div class="text-xl font-black">🔥 ${state.user.streak}</div><div class="text-xs text-[var(--muted)]">سلسلة</div></div>

        <button onclick="closeModalPlain();navigate('lesson')" class="flex-1 btn-primary py-3 rounded-xl font-bold">العودة للدروس</button>
      </div>
    </div>`;
  openModal(content);
  if(success) confetti();
}

  const earned = JSON.parse(localStorage.getItem('mbj_achievements')||'[]');

  localStorage.setItem('mbj_achievements', JSON.stringify(earned));
  saveState();
}

function openVocabTopic(id, name){
  // Build vocabulary from existing lesson words + topic mapping
  const l = LANGS[state.currentLang];
  let words = [];
  // Gather relevant words
  const all = Object.values(LESSONS[state.currentLang]).flat();
  if(id==='family') words = all.find(x=>x.title.includes('العائلة'))?.words || [];
  else if(id==='school') words = all.find(x=>x.title.includes('المدرسة'))?.words || [];
  else if(id==='food') words = all.find(x=>x.title.includes('الطعام'))?.words || [];
  else if(id==='travel') words = all.find(x=>x.title.includes('السفر'))?.words || [];
  else words = [
    {w: id==='home'?'Casa':'', m:'المنزل'},{w: id==='sport'?'Fútbol':'', m:'كرة القدم'},
    {w: id==='tech'?'Ordenador':'', m:'الحاسوب'},{w: id==='countries'?'España':'', m:'إسبانيا'},
    {w: id==='jobs'?'Médico':'', m:'طبيب'},{w: id==='time'?'Hora':'', m:'الساعة'},
    {w: id==='weather'?'Sol':'', m:'الشمس'}
  ].filter(w=>w.w);
  // Adapt for English/French
  if(state.currentLang==='en'){
    words = [
      {w:'Home',m:'المنزل'},{w:'Football',m:'كرة القدم'},{w:'Computer',m:'الحاسوب'},
      {w:'Spain',m:'إسبانيا'},{w:'Doctor',m:'طبيب'},{w:'Time',m:'الساعة'},{w:'Sun',m:'الشمس'}
    ];
    if(id==='family') words = all.find(x=>x.title.includes('العائلة'))?.words || words;
    if(id==='school') words = all.find(x=>x.title.includes('المدرسة'))?.words || words;
    if(id==='food') words = all.find(x=>x.title.includes('الطعام'))?.words || words;
    if(id==='travel') words = all.find(x=>x.title.includes('السفر'))?.words || words;
  }
  if(state.currentLang==='fr'){
    words = [
      {w:'Maison',m:'المنزل'},{w:'Football',m:'كرة القدم'},{w:'Ordinateur',m:'الحاسوب'},
      {w:'Espagne',m:'إسبانيا'},{w:'Médecin',m:'طبيب'},{w:'Heure',m:'الساعة'},{w:'Soleil',m:'الشمس'}
    ];
    if(id==='family') words = all.find(x=>x.title.includes('العائلة'))?.words || words;
    if(id==='school') words = all.find(x=>x.title.includes('المدرسة'))?.words || words;
    if(id==='food') words = all.find(x=>x.title.includes('الطعام'))?.words || words;
    if(id==='travel') words = all.find(x=>x.title.includes('السفر'))?.words || words;
  }
  if(id==='family'||id==='school'||id==='food'||id==='travel'){
    words = all.find(x=>x.title.includes(name.includes('العائلة')?'العائلة':name.includes('المدرسة')?'المدرسة':name.includes('الطعام')?'الطعام':'السفر'))?.words || words;
  }

  const content = `
    <div class="flex items-center gap-3 mb-4">
      <div class="text-4xl">${VOCAB_TOPICS.find(t=>t.id===id).icon}</div>
      <div>
        <h2 class="text-xl font-bold">${name} — ${l.native}</h2>
        <p class="text-sm text-[var(--muted)]">${words.length} كلمة</p>
      </div>
    </div>
    <div class="space-y-2 max-h-96 overflow-y-auto scrollbar-hide">
      ${words.map(w=>`
        <div class="flex items-center justify-between bg-[var(--bg-2)] rounded-xl px-4 py-3">
          <div>
            <div class="font-bold text-lg">${w.w}</div>
            <div class="text-sm text-[var(--muted)]">${w.m}</div>
          </div>
          <div class="flex gap-1">
            <button onclick="speak('${w.w.replace(/'/g,"\\'")}','${state.currentLang}')" class="w-10 h-10 rounded-full bg-[var(--brand)] text-white flex items-center justify-center">🔊</button>

          </div>

      options:{plugins:{legend:{display:false}},scales:{y:{beginAtZero:true,max:100}},responsive:true}

    const data = days.map((_,i)=>Math.floor(Math.random()*60)+ (i<5?20:5));

    xpChart = new Chart(xpCtx, {
      type:'line',
      data:{

        datasets:[{
          label:'XP',
          data,
          borderColor:'#0ea5a4',
          backgroundColor:'rgba(14,165,164,.15)',

          tension:.4,
          pointBackgroundColor:'#f97316',
          pointRadius:5

      options:{plugins:{legend:{display:false}},scales:{y:{beginAtZero:true}},responsive:true}
    });

}

        <div class="flex items-center gap-3 mb-3"><span class="text-2xl">🎯</span><div><div class="font-bold">الهدف اليومي</div><div class="text-xs text-[var(--muted)]">XP يومياً</div></div></div>
        <div class="flex gap-2">
          ${[20,30,50,100].map(g=>`<button onclick="state.user.dailyGoal=${g};saveState();navigate('settings')" class="flex-1 py-2 rounded-xl font-bold text-sm ${state.user.dailyGoal===g?'brand-grad text-white':'border border-[var(--border)]'}">${g} XP</button>`).join('')}

      <button onclick="resetData()" class="w-full text-right p-3 rounded-xl hover:bg-red-50 text-red-500 font-bold">حذف كل البيانات ←</button>

}

function resetData(){
  const content = `
    <div class="text-center">
      <div class="text-6xl mb-3">⚠️</div>
      <h2 class="text-xl font-bold mb-2">تأكيد الحذف</h2>
      <p class="text-[var(--muted)] mb-5">سيتم حذف كل تقدمك ونقاطك. لا يمكن التراجع.</p>
      <div class="flex gap-2">
        <button onclick="closeModalPlain()" class="flex-1 py-3 rounded-xl border border-[var(--border)] font-bold">إلغاء</button>
        <button onclick="doReset()" class="flex-1 bg-red-500 text-white py-3 rounded-xl font-bold">حذف نهائي</button>
      </div>
    </div>`;
  openModal(content);
}
function doReset(){
  localStorage.removeItem('mbjlingo');
  localStorage.removeItem('mbj_achievements');
  location.reload();
}

// ===== Modal =====
function openModal(content){
  $('#modalContent').innerHTML = content;
  $('#modal').classList.remove('hidden');
  $('#modal').classList.add('flex');
}
function closeModal(e){
  if(e.target.id==='modal') closeModalPlain();
}
function closeModalPlain(){
  $('#modal').classList.add('hidden');
  $('#modal').classList.remove('flex');
}

// ===== Init =====
function init(){
  loadState();
  applyTheme();
  checkStreak();
  $('#topXP').textContent = state.user.xp;
  $('#topStreak').textContent = state.user.streak;
  $('#avatarBtn').textContent = state.user.name[0];
  setTimeout(()=>{
    $('#splash').style.transition='opacity .5s';
    $('#splash').style.opacity='0';
    setTimeout(()=>{
      $('#splash').style.display='none';
      $('#app').classList.remove('hidden');
      navigate('home');
      // Welcome notification
      if(state.notifications && state.user.streak>0){
        setTimeout(()=>toast(`🔥 حافظ على سلسلتك! ${state.user.streak} يوم متتالي`,'success'), 800);
      }
    }, 500);
  }, 1800);
}

document.getElementById('modal').addEventListener('click', closeModal);
window.addEventListener('keydown', e=>{ if(e.key==='Escape') closeModalPlain(); });
init();
</script>
